# The cinegram website: https://panset.github.io/cinegram/
#
# Zensical builds www/ into _site/. Half of www/ is prose someone wrote; the
# other half — examples/, guide/ and the compiled timelines — is generated by
# `bazel run //site:sync` and checked by //site:site_test. See site/site.go.
#
# Bazel cannot run this build: Zensical is a Python package, and the repository
# takes no dependency it cannot fetch itself. So the split is deliberate —
# Bazel owns the input and guarantees it is current, Zensical owns the render.
# .github/workflows/pages.yml is where the two meet.

[project]
site_name = "Cinegram"
site_description = "Animated, narrated, explorable architecture diagrams from a Mermaid-compatible DSL."
site_url = "https://panset.github.io/cinegram/"
repo_url = "https://github.com/panset/cinegram"
repo_name = "panset/cinegram"
docs_dir = "www"
site_dir = "_site"

# The embed kit, installed into www/assets/cinegram/ by
# `bazel run //cmd/cinegram -- assets`. Both files are site-wide and
# deliberately cheap: the CSS is only the host box, and the JS does nothing at
# all on a page with no `.cinegram` element. The player itself — mermaid
# (2.6 MB), runtime.js, runtime.css — is fetched by the loader only on the
# pages that show a diagram, which is why it is not listed here. That is the
# same arrangement any other site takes; see www/embedding.md.
# `mainframe.css` is the site's theme and is listed last on purpose: it
# retunes Material's palette variables and squares off the chrome, and the
# one rule it aims at the player's host box has to land after the embed kit's
# own. See the file's header for what the two schemes are.
extra_css = [
  "assets/cinegram/cinegram-embed.css",
  "assets/stylesheets/mainframe.css",
]
extra_javascript = ["assets/cinegram/cinegram-embed.js"]

# No `nav`. The folder tree is the navigation, which is also how `cinegram
# site` works and why the generated example pages keep their 01- filename
# prefixes: Zensical sorts by filename, and the tour has an order. Page titles
# come from each page's own H1, so the prefixes never reach a reader.

# No `markdown_extensions` either. Naming any of them replaces Zensical's
# defaults wholesale, and the defaults already carry everything the pages use:
# admonition and pymdownx.details for the collapsed source blocks, attr_list
# for the buttons, md_in_html for the card grid, superfences for mermaid.

[project.theme]
variant = "classic"
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.indexes",
  "search.suggest",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "light mode"
