<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="The app's sign-in page, offering a single sign-in button">
  <!-- Flat-colour mockups, deliberately: a storyboard frame has to read at
       thumbnail size beside a diagram, and a real screenshot does not. Every
       frame in this set shares one geometry so the panel does not jump as the
       scenes change: a 480x320 page, a 34px address strip, one card. -->
  <rect width="480" height="320" rx="10" fill="#ffffff" stroke="#dfe3e8"/>
  <path d="M0 10a10 10 0 0 1 10-10h460a10 10 0 0 1 10 10v24H0z" fill="#f1f3f5"/>
  <rect x="14" y="9" width="200" height="16" rx="8" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6b7480">app.example.com</text>
  <line x1="0" y1="34" x2="480" y2="34" stroke="#dfe3e8"/>

  <rect x="120" y="76" width="240" height="180" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
  <rect x="220" y="98" width="40" height="40" rx="10" fill="#2f6feb"/>
  <text x="240" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">A</text>

  <text x="240" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c2024">Sign in to Acme</text>
  <text x="240" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7480">Use your organisation account</text>

  <rect x="148" y="200" width="184" height="34" rx="8" fill="#2f6feb"/>
  <text x="240" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Login with Authhub</text>
</svg>
