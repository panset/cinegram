<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="The identity provider's second-factor prompt, waiting on a six-digit code">
  <rect width="480" height="320" rx="10" fill="#ffffff" stroke="#dfe3e8"/>
  <path d="M0 10a10 10 0 0 1 10-10h460a10 10 0 0 1 10 10v24H0z" fill="#f1f3f5"/>
  <rect x="14" y="9" width="200" height="16" rx="8" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7c3aed">login.idp.example</text>
  <line x1="0" y1="34" x2="480" y2="34" stroke="#dfe3e8"/>

  <rect x="120" y="72" width="240" height="188" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
  <rect x="226" y="92" width="28" height="34" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <path d="M234 92v-6a6 6 0 0 1 12 0v6" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="240" cy="109" r="3" fill="#7c3aed"/>

  <text x="240" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c2024">Two-factor check</text>
  <text x="240" y="171" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7480">Enter the code from your authenticator</text>

  <!-- Six boxes: the frame has to say "a code goes here" without a caption. -->
  <g fill="#ffffff" stroke="#dfe3e8">
    <rect x="150" y="190" width="26" height="32" rx="6"/>
    <rect x="182" y="190" width="26" height="32" rx="6"/>
    <rect x="214" y="190" width="26" height="32" rx="6"/>
    <rect x="246" y="190" width="26" height="32" rx="6"/>
    <rect x="278" y="190" width="26" height="32" rx="6"/>
    <rect x="310" y="190" width="26" height="32" rx="6" stroke="#7c3aed"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1c2024" text-anchor="middle">
    <text x="163" y="212">4</text>
    <text x="195" y="212">1</text>
    <text x="227" y="212">7</text>
    <text x="259" y="212">2</text>
    <text x="291" y="212">9</text>
  </g>

  <text x="240" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7480">Acme never sees this step</text>
</svg>
