<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Back on the app's domain on a blank interstitial while the server finishes the login">
  <rect width="480" height="320" rx="10" fill="#ffffff" stroke="#dfe3e8"/>
  <path d="M0 10a10 10 0 0 1 10-10h460a10 10 0 0 1 10 10v24H0z" fill="#f1f3f5"/>
  <rect x="14" y="9" width="248" height="16" rx="8" fill="#ffffff" stroke="#dfe3e8"/>
  <!-- The callback URL, with the code sitting in plain view: this is the frame
       that makes "a code is safe in the address bar" concrete. -->
  <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7480">app.example.com/callback?code=4/0Ab…&amp;state=…</text>
  <line x1="0" y1="34" x2="480" y2="34" stroke="#dfe3e8"/>

  <!-- A static spinner arc. Nothing here animates: a storyboard frame is a
       still, and a spinning one would compete with the diagram beside it. -->
  <circle cx="240" cy="150" r="22" fill="none" stroke="#dfe3e8" stroke-width="4"/>
  <path d="M240 128a22 22 0 0 1 22 22" fill="none" stroke="#2f6feb" stroke-width="4" stroke-linecap="round"/>

  <text x="240" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c2024">Signing you in…</text>
  <text x="240" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7480">The browser is idle from here on</text>
</svg>
