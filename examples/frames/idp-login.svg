<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="The identity provider's credential form, on the provider's own domain">
  <rect width="480" height="320" rx="10" fill="#ffffff" stroke="#dfe3e8"/>
  <path d="M0 10a10 10 0 0 1 10-10h460a10 10 0 0 1 10 10v24H0z" fill="#f1f3f5"/>
  <rect x="14" y="9" width="200" height="16" rx="8" fill="#ffffff" stroke="#dfe3e8"/>
  <!-- The address is the whole point of this frame: the password is being
       typed on the provider's domain, not the app's. -->
  <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7c3aed">login.idp.example</text>
  <line x1="0" y1="34" x2="480" y2="34" stroke="#dfe3e8"/>

  <rect x="120" y="60" width="240" height="212" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
  <rect x="222" y="80" width="36" height="36" rx="18" fill="#7c3aed"/>
  <text x="240" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">I</text>
  <text x="240" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c2024">Sign in</text>

  <text x="144" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7480">Email</text>
  <rect x="144" y="170" width="192" height="28" rx="7" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="154" y="188" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1c2024">ada@acme.example</text>

  <text x="144" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7480">Password</text>
  <rect x="144" y="222" width="192" height="28" rx="7" fill="#ffffff" stroke="#7c3aed"/>
  <text x="154" y="241" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="2" fill="#6b7480">••••••••••</text>
</svg>
