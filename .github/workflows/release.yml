# Pushing a tag `v*` releases cinegram. The shape is qualify → channels →
# verify, and the shape is the contract (see RELEASING.md):
#
#   qualify   builds and tests every deliverable once, then hands them to the
#             channel jobs as workflow artifacts.
#   smoke     runs the actual shipped binaries on real macOS/Linux/Windows
#             runners — unit tests passing while a cross-compiled binary is
#             broken is exactly the failure this catches.
#   channel-* each distribution channel is one job that consumes the qualified
#             artifacts and never rebuilds. Adding a way to ship cinegram
#             (a playground, a package manager) means adding one job here
#             with `needs: smoke`. Channel jobs are independent, so a failed
#             one can be re-run from the Actions UI without re-releasing.
#   verify    installs from the published release exactly the way the skill
#             in skills/cinegram/ does, proving the install contract end to
#             end.
#
# The asset names (cinegram-<os>-<arch>) are a contract: the skill downloads
# releases/latest/download/cinegram-$TARGET and `cinegram upgrade` downloads
# the same names, so renaming one breaks installs everywhere at once.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bazelisk reads .bazelversion, so CI builds with the same Bazel as dev.
      - uses: bazelbuild/setup-bazelisk@v3

      # The tag must be the version the source claims. package.json and the
      # changelog agreeing with version.go is //editors/vscode:assets_test's
      # job, which the suite below runs; this step ties the knot to the tag.
      - name: Gate — tag matches the source version
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "const version = \"$V\"" cmd/cinegram/version.go; then
            echo "::error::tag $GITHUB_REF_NAME does not match cmd/cinegram/version.go — bump the version everywhere first (see RELEASING.md)"
            exit 1
          fi

      - name: Qualify
        run: bazel test //...

      - name: Build release binaries
        run: |
          targets="darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64"
          bazel build $(for t in $targets; do echo "//cmd/cinegram:cinegram_$t"; done)
          mkdir -p dist
          for t in $targets; do
            ext=""
            [ "$t" = "win32-x64" ] && ext=".exe"
            cp "$(bazel cquery --output=files "//cmd/cinegram:cinegram_$t")" "dist/cinegram-$t$ext"
          done
          (cd dist && sha256sum cinegram-* > SHA256SUMS)

      - name: Build extension packages
        run: |
          V="${GITHUB_REF_NAME#v}"
          bazel build //cmd/vsix
          VSIX="$(bazel cquery --output=files //cmd/vsix)"
          mkdir -p dist-vsix
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            "$VSIX" --target "$t" --binary "dist/cinegram-$t" \
              --extension-dir editors/vscode --out "dist-vsix/cinegram-$V-$t.vsix"
          done
          "$VSIX" --target win32-x64 --binary dist/cinegram-win32-x64.exe \
            --extension-dir editors/vscode --out "dist-vsix/cinegram-$V-win32-x64.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist-vsix/
          if-no-files-found: error

  # The binaries above were cross-compiled on one Linux machine; this is where
  # each one meets its actual platform. The record step is deliberate: it
  # exercises the headless-Chrome capture path, the most environment-dependent
  # thing cinegram does.
  smoke:
    needs: qualify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            chrome: /usr/bin/google-chrome
          - os: macos-14
            target: darwin-arm64
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          - os: windows-latest
            target: win32-x64
            suffix: .exe
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # for examples/

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Smoke-test the shipped binary
        shell: bash
        env:
          CINEGRAM_CHROME: ${{ matrix.chrome }}
        run: |
          BIN="dist/cinegram-${{ matrix.target }}${{ matrix.suffix }}"
          chmod +x "$BIN"
          V="${GITHUB_REF_NAME#v}"
          test "$("$BIN" version)" = "cinegram $V"
          "$BIN" lint examples/01-basics/01-k8s-request.dgm
          "$BIN" compile examples/01-basics/01-k8s-request.dgm -o smoke.json
          "$BIN" preview examples/01-basics/01-k8s-request.dgm -o smoke.html
          "$BIN" record examples/02-storytelling/01-payment-checkout.dgm -o smoke.gif --fps 2
          test -s smoke.gif

  channel-github-binaries:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist-vsix

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cinegram ${GITHUB_REF_NAME#v}" \
            --verify-tag \
            --notes "Standalone \`cinegram\` CLI — statically linked, no dependencies. Qualified by \`bazel test //...\` and per-platform smoke tests at this tag.

          Install (macOS/Linux):
          \`\`\`sh
          TARGET=\"\$(uname -s | tr A-Z a-z)-\$(uname -m | sed -e s/x86_64/x64/ -e s/aarch64/arm64/)\"
          curl -fsSL \"https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/cinegram-\$TARGET\" -o /usr/local/bin/cinegram && chmod +x /usr/local/bin/cinegram
          \`\`\`

          Already installed? \`cinegram upgrade\` replaces the binary in place.

          The \`.vsix\` files are the VS Code extension, one per platform, for installing without the Marketplace (*Extensions: Install from VSIX…*).

          GIF recording needs nothing else installed; PNG frames need a Chrome/Chromium (\$CINEGRAM_CHROME); mp4/webm need ffmpeg." \
            dist/* dist-vsix/*

  channel-vscode-marketplace:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist-vsix

      # The same REST call for every platform package: the gallery keys on
      # the TargetPlatform baked into each .vsix. api-version 7.1-preview.2 is
      # required — preview.1 only accepts a JSON body.
      - name: Publish to the VS Code Marketplace
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          if [ -z "$MARKETPLACE_PAT" ]; then
            echo "::error::the MARKETPLACE_PAT secret is missing or empty — mint one and store it per RELEASING.md"
            exit 1
          fi
          for f in dist-vsix/*.vsix; do
            echo "publishing $f"
            curl -sS --fail-with-body -X PUT \
              -H "Content-Type: application/octet-stream" \
              -u ":$MARKETPLACE_PAT" \
              --data-binary "@$f" \
              "https://marketplace.visualstudio.com/_apis/gallery/publishers/tejaspanse/extensions/cinegram?extensionType=vsix&api-version=7.1-preview.2"
            echo
          done

  # The two package-manager shims are launchers: they carry no binary and
  # resolve https://github.com/…/releases/download/v$V/<asset> the first time a
  # user runs them. That is why these two jobs, alone among the channels, also
  # need channel-github-binaries — published a moment earlier, they would ship
  # a package whose every invocation 404s. See RELEASING.md.
  #
  # Both gate on the release carrying every asset their platform tables can
  # name. The list below is written out rather than derived, because it *is*
  # the assertion: it mirrors TARGETS in packaging/npm/bin/cinegram.js and in
  # packaging/pypi/src/cinegram/__init__.py, and a platform added to either
  # launcher without a matching build in `qualify` should fail loudly here
  # rather than 404 on a user's first run.
  channel-npm:
    needs: [smoke, channel-github-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read # a job-level block replaces the workflow default, and checkout needs this
      id-token: write # npm provenance signs against this workflow run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Gate — the release carries every asset the launcher can name
        run: |
          awk '{print $2}' dist/SHA256SUMS > /tmp/released-assets
          for asset in cinegram-darwin-arm64 cinegram-darwin-x64 \
                       cinegram-linux-x64 cinegram-linux-arm64 \
                       cinegram-win32-x64.exe; do
            if ! grep -Fxq "$asset" /tmp/released-assets; then
              echo "::error::SHA256SUMS has no entry for $asset — npx cinegram would 404 on that platform"
              exit 1
            fi
          done

      - name: Publish to npm
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPM_TOKEN secret is missing or empty — mint one and store it per RELEASING.md"
            exit 1
          fi
          npm publish --access public --provenance

  channel-pypi:
    needs: [smoke, channel-github-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read # a job-level block replaces the workflow default, and checkout needs this
      id-token: write # PyPI trusted publishing — the run itself is the credential
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Gate — the release carries every asset the launcher can name
        run: |
          awk '{print $2}' dist/SHA256SUMS > /tmp/released-assets
          for asset in cinegram-darwin-arm64 cinegram-darwin-x64 \
                       cinegram-linux-x64 cinegram-linux-arm64 \
                       cinegram-win32-x64.exe; do
            if ! grep -Fxq "$asset" /tmp/released-assets; then
              echo "::error::SHA256SUMS has no entry for $asset — uvx cinegram would 404 on that platform"
              exit 1
            fi
          done

      # A pure-Python launcher, so one sdist and one universal wheel; nothing
      # here compiles or copies a binary.
      - name: Build the sdist and wheel
        working-directory: packaging/pypi
        run: |
          python -m pip install --upgrade build
          python -m build

      # No secret: the repository is registered as a trusted publisher for the
      # cinegram project on PyPI, and the id-token above is what it trusts.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packaging/pypi/dist/

  # Install from the published release exactly the way skills/cinegram/SKILL.md
  # tells an agent to, so the one path users actually take is the one tested —
  # and then the same for each package manager, since a shim that resolves its
  # download at run time can only be proved by running it. The retries are for
  # /latest/ propagation and for registry indexing right after publishing.
  verify:
    needs: [channel-github-binaries, channel-npm, channel-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Install as the skill does
        run: |
          TARGET="$(uname -s | tr A-Z a-z)-$(uname -m | sed -e s/x86_64/x64/ -e s/aarch64/arm64/)"
          for i in $(seq 1 10); do
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/cinegram-$TARGET" -o cinegram && break
            echo "release not yet visible at /latest/ (attempt $i)"
            sleep 15
          done
          chmod +x cinegram
          test "$(./cinegram version)" = "cinegram ${GITHUB_REF_NAME#v}"
          ./cinegram upgrade --check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Both of these download the release binary themselves, so a green run
      # here is the whole shim path: registry → launcher → GitHub release →
      # checksum → exec.
      - name: Run it as `npx cinegram` does
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 10); do
            out="$(npx --yes "cinegram@$V" version)" && break
            echo "cinegram@$V not yet installable from npm (attempt $i)"
            sleep 15
          done
          test "$out" = "cinegram $V"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run it as `uvx cinegram` does
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 10); do
            out="$(uvx "cinegram==$V" version)" && break
            echo "cinegram==$V not yet installable from PyPI (attempt $i)"
            sleep 15
          done
          test "$out" = "cinegram $V"
